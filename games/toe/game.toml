# game.toml - what the kit needs to know about Tribes of the East
# (GOG 3.1 v3, Russian, a standalone install, bin/H5_Game.exe 3.1.2.99: the
# 2025 MSVC 14.29 rebuild of the second expansion). Reads
# profiles/autoexec_a2.cfg; its granny2.dll is the base game's code with an
# Authenticode signature added (only the checksum and certificate differ).
# Values marked "sentinel" are not identified yet: they point into the
# zero-filled padding after .rsrc (0x0126f408-0x0126ffff), which the game never
# references, so the kit's hooks compile and never fire. Replace each one with a
# real address as bring-up finds it.

[game]
id = "homm5-toe"
name = "Heroes of Might and Magic V: Tribes of the East"
app_name = "HommaRe-ToE"
bundle_id = "io.github.hommare.toe"
previous_app_names = ["Heroes5ToE"]
previous_bundle_ids = ["io.github.homm5-native-mac.toe"]
executable = "H5_Game.exe"
sha256 = "3eb6fce81071f48631360202d81d41c67b09d8b1807105b1f22c402e15d16268"
image_base = 0x00400000
entry_point = 0x00949fe3
# The game runs from bin/ and reads ..\data; original/ links to a flattened
# view (bin/ files beside data/, profiles/...) so ".." at the root clamps to it.
guest_root = 'C:\Heroes5'
# The Russian release: profile and save names are ANSI in Windows-1251.
ansi_codepage = 1251
developer_exe = "original/H5_Game.exe"
windows_version = "5.1.2600"
# The image ends at 0x01305000, above the kit's default heap base (0x01000000).
heap_base = 0x01400000
# The arena reaches past 0x50000000 for granny2.dll, which has to sit at its
# own base (see [modules.aux.granny2]); the extra heap stays below 1 GB.
# 0x10000000-0x10400000 is kept for DLLs translated beside the exe.
guest_size = 0x50100000
heap_extra_base = 0x10400000
heap_extra_size = 0x2fc00000

# CPUID reports SSE and SSE2: the game's and granny2's vectorised skinning,
# vertex and animation paths instead of x87 (+26% fps on the zoomed-out map,
# 2026-10-20). RECOMP_CPUID_SSE=0 turns it off for a run.
cpuid_sse = true

# LAN games (Сетевая игра → Локальная сеть): WinSock on the host's sockets
# (kit/runtime/winsock.cpp).
sockets = true

[translate]
listings = "analysis/decompiled/H5_Game.exe"
globals = "globals.toml"
animation_counter = 0x0126ff00  # sentinel
volatile_reads = []
# Thread bodies Ghidra misses get listed here as bring-up finds them.
entry_points = []
# Native code linked with the translation: the shared touch adapter, settings
# save, map camera, the phone's interface and Hor+ (native/*.c). header (native/overrides.h) holds the
# FN_<addr> replacements every translated chunk includes; addresses
# (native/addresses.h) this game's addresses, which only these sources include.
native = { header = "native/overrides.h", addresses = "native/addresses.h", sources = ["../../native/overrides.c", "../../native/touch.c", "../../native/save.cpp", "../../native/camera.c", "../../native/phone_hud.c", "../../native/horplus.c", "../../native/ui_bounds.c", "../../native/granny.c", "../../native/lighting.c", "../../native/scene.c", "../../native/gpu_skin.cpp", "../../native/phone_layout.c", "../../native/render_split.c", "../../native/tap_attack.c", "../../native/native_screens.c", "../../native/screens_custom.c", "../../native/screens_menu.c", "../../native/screens_load.c", "../../native/screens_hof.c", "../../native/screens_options.c", "../../native/screens_duel.c", "../../native/screens_question.c", "../../native/screens_escmenu.c", "../../native/screens_lan.c", "../../native/screens_ubi.c", "../../native/screens_words.c", "../../native/gs_login.c", "../../native/net_guard.c"] }
# A Direct3D 9 game: no DirectDraw lock to track, so stores skip the watch/dirty check.
store_hooks = false
# As in the base game: flags are followed over the jumps inside a function
# (CMP; Jcc computes only what is read after it), and the eight registers live
# in C locals inside each translated body.
flag_liveness = "cfg"
reg_cache = true
# As in the base game (game.toml there): lazy buffers by page protection, guest
# memory at a fixed address (macOS), and the CALL continuation hint for RET.
write_track = "protect"
fixed_guest_base = true
ret_hint = true
lean_calls = true

# RAD Game Tools' Granny 2 (bin/granny2.dll, VC6, 2004): models and skeletal
# animation; H5_Game.exe imports 46 of its 772 exports. Translated like the
# game. It imports only KERNEL32 and MessageBoxA.
# It must stay at its preferred base 0x50000000, not a rebased copy: the
# game's .gr2 files carry raw pointers to granny2's built-in type
# definitions as the exporter saw them (0x50055080 and its neighbours), and
# the loader's type comparison (50001de0) follows them. A copy
# rebased to 0x10200000 crashed there on the first animation
# (bin/Animations/069F5387-..., run 2026-10-17).
[modules.aux.granny2]
name = "granny2.dll"
path = "original/granny2.dll"
sha256 = "b40c1636c298ba0af1bfda8cc6db38c73924a2f85397976e40cf2fc2365aae00"
base = 0x50000000
size = 0x86000
listings = "analysis/decompiled/granny2.dll"

[hooks]
# All sentinels until bring-up identifies them.
frame_clock_begin = 0x0126ff10
frame_clock_wait = 0x0126ff14
frame_clock_wait_clamp = 0x0126ff18
frame_clock_clamp_deadline = 0x0126ff20
frame_clock_wait_deadline = 0x0126ff24
cursor_surface_ptrs = [0x0126ff30, 0x0126ff34]
mouse_vtable = 0x0126ff40
mouse_device_ptr = 0x0126ff44
mouse_device_right = 0x0126ff48
camera = 0x0126ff50
sprites = []

[mods]
builtin = "none"

# "Exit to Windows" is not where a Mac or an iPad goes, and Ubi.com is ubi-gs
# (see the base game's game.toml [texts] and [online]).
[texts]
pak = "data/zz-port-texts.pak"
files = [
    "Text/ExitMenu/ExitTheGame.txt",
    "UI/EscMenu/QuitToWindows.txt",
    "UI/EscMenu/TTQuit.txt",
    "UI/ExitGameQuestion/Header.txt",
    "UI/ExitGameQuestion/Question.txt",
    "UI/MainMenu2/TTQuit.txt",
    "UI/CombatReplayScreen/TTQuitFromReplay.txt",
    # The buttons' click, at a quarter of its volume.
    "Sounds/_(Sound)/Interface/General/standart_click.xdb",
    "Sounds/_(Sound)/Interface/General/standart_disabled_click.xdb",
    # Ubi.com is ubi-gs now ([online] below): the Multi Player menu's entry,
    # its tooltip, and every message that names the service.
    "UI/MainMenu2/MultiPlayer/UbiCom.txt",
    "UI/MainMenu2/MultiPlayer/TTUbiCom.txt",
    "UI/MPRegister/connecting.txt",
    "UI/MPRegister/cant-connect.txt",
    "UI/MPRegiter/TTAccount.txt",
    "UI/MPRegiter/TTOk.txt",
    # The login dialog's hint, always shown: not the player's Ubisoft login.
    "UI/MPRegiter/hint.txt",
    "UI/EscMenu/ExitToUbiLobbyQuestion.txt",
    "UI/EscMenu/ExitToUbiLobbyTitle.txt",
    "UI/Lobby/Texts/UbiComError.txt",
    "UI/MPChangeChannel/mode_tooltip.txt",
    "UI/MPDMCreate/cannot-create.txt",
    "UI/MPDMWait/ubi-com-error.txt",
    "UI/MPProfile/AcquireProfileFailedText.txt",
    "UI/MPProfile/TTLosses.txt",
    "UI/MPProfile/TTWins.txt",
    "UI/MatchMakerErrors/UCLE_GS_ERROR.txt",
    "UI/MatchMakerErrors/UCLE_GS_SEND_FAILED.txt",
    "UI/Common/game_type_1.txt",
    "UI/Common/MsgBoxAdventureMapDisconnectedFromUbiComText.txt",
    "UI/Common/MsgBoxAdventureMapOtherPlayerDisconnectedFromUbiComText.txt",
    "UI/Common/MsgBoxDisconnectedFromChatForFloodText.txt",
    "UI/Common/MsgBoxMPInterfacesDisconnectedFromUbiComText.txt",
    "UI/Texts/ubi_send_results_success.txt",
    "UI/Texts/ubi_send_results_wait.txt",
]

# Made in this order, in every listed file. The tooltip's sentence comes before
# the service's bare name, which would otherwise leave it "via ubi-gs website".
# Another language that writes the name as Ubi.com gets ubi-gs in its own words.
# The login dialog's hint pointed at Ubisoft's account site, which is gone; it
# says not to use a Ubisoft login instead (English), or gets that line on top
# (another language, whose hint starts with the same markup).
[texts.replace]
"<body><color_default>If you have forgotten your password or need to manage your account use the <color_bright>Account <color_default>button." = "<body><color_bright>Not your Ubisoft login!<color_default> Make up a name and password for this ubi-gs server."
# The Russian install's hint the same way, in its own words, before the line below adds the English one.
"<body><color_default>Если вы забыли свой пароль или хотите изменить личные данные, нажмите кнопку <color_bright>Профиль<color_default>." = "<body><color_bright>Это не ваш логин Ubisoft!<color_default> Придумайте имя и пароль для этого сервера ubi-gs."
# The German, French and Polish installs' hints the same way.
"<body><color_default>Falls Ihr Euer Passwort vergessen habt oder Euer Konto verwalten müsst, benutzt die <color_default>Schaltfläche <color_bright>Konto." = "<body><color_bright>Nicht Euer Ubisoft-Login!<color_default> Denkt Euch einen Namen und ein Passwort für diesen ubi-gs-Server aus."
"<body><color_default>Si vous avez oublié votre mot de passe ou que vous désirez gérer votre compte, utilisez le bouton <color_bright>Compte<color_default>." = "<body><color_bright>Ce n’est pas votre identifiant Ubisoft !<color_default> Choisissez un nom et un mot de passe pour ce serveur ubi-gs."
"<body><color_default>Jeśli zapomniałeś hasła lub potrzebujesz dokonać zmian na koncie naciśnij przycisk <color_bright>konto<color_default>." = "<body><color_bright>To nie jest twój login Ubisoft!<color_default> Wymyśl nazwę i hasło dla tego serwera ubi-gs."
"<body><color_default>" = "<body><color_bright>Not your Ubisoft login!<color_default> Make up a name and password for this ubi-gs server.<br><color_default>"
"в  Windows" = "в систему"
"в Windows" = "в систему"
"to Windows" = "to Desktop"
"zu Windows" = "zum Desktop"
"vers Windows" = "vers le bureau"
"sous Windows" = "au bureau"
"do Windows" = "do pulpitu"
"<VolumeBase>1</VolumeBase>" = "<VolumeBase>0.25</VolumeBase>"
"via ubi.com website" = "through a ubi-gs community server"
"auf dem ubi.com-Server" = "auf einem ubi-gs-Community-Server"
"via le site ubi.com" = "via un serveur communautaire ubi-gs"
"korzystając ze strony ubi.com" = "korzystając z serwera społeczności ubi-gs"
"Ubi.com" = "ubi-gs"
"ubi.com" = "ubi-gs"
"UBI.com" = "ubi-gs"

# Multi Player > Ubi.com against a community server: Ubisoft shut the game's
# online services down on 6 October 2015, and ubi-gs
# (github.com/michal-kapala/ubi-gs) answers the same requests. The game asks
# gsconnect_host for the addresses of its other servers when Ubi.com is
# clicked, never at start; kit/runtime/curl_http.cpp sends that one request to
# the server the player names in the host's prompt (kit/host/server_prompt.cpp),
# which keeps the servers that answered, most recent first, in the profile's
# ubi-gs-servers.txt.
[online]
gsconnect_host = "gsconnect.ubisoft.com"
prompt_title = "ubi-gs server"
prompt_text = """Ubisoft closed the official Heroes of Might and Magic V servers in 2015. \
ubi-gs is a community re-implementation of them (github.com/michal-kapala/ubi-gs).
Someone has to run it, and every player who wants to play together must use the same \
server.
ubigs.wayofharm.com is the default community server; type another address to use a different one.
The server sees the CD key you log in with: any CD key works, so don't type your real one. \
Your password reaches it only as a salted hash, but still make up a name and password for \
this server, not your Ubisoft login or a password you use elsewhere."""
# Offered in the prompt while the player has used no server yet.
default_server = "ubigs.wayofharm.com"

[controls]
pad = "off"

# Heroes V shows its info blocks on hover: a finger that rests hovers instead
# of right-clicking, a second finger right-clicks (design notes ios-touch-plan.md 1.1).
# The full keyboard stays folded away until asked for.
[touch]
keypad = "hidden"
gestures = "hover"
# A finger drag pans with the game's wheel-button drag (camera_strafe_mouse /
# camera_forward_mouse), which moves the camera a little per mouse count: a
# pan scales its counts so the map keeps up with the finger. Measured in the
# simulator, 2026-10-18 (campaign map 1, Битва полов): the camera's pan, its wheel
# zoom and its Delete/Insert turn all answer against the fingers.
pan_gain = 28
invert = ["panx", "pany", "rotate"]

# A new profile starts at the screen's own size ("screen": 2752x2064 on a
# 13-inch iPad, 2796x1290 on an iPhone 15 Pro Max), not the game's 1024x768
# (the imported copy's default profile is edited at launch). The interface is
# drawn at it; the 3D at the launcher's render quality, upscaled by MetalFX.
[ios]
# A strategy map wants the width: an iPhone plays it in landscape only.
portrait = false
# On an iPhone only, the corner menus' mod (the layout itself is native). The
# game anchors its screens to the edges itself. On every iOS device the
# dragged creature's icon is framed for a finger and the screen resolution is
# out of the options; everywhere the dialogue scenes span the whole screen.
# All are made on the device from the player's install (ui-mods/<name>.recipe,
# kit/host/ui_mods.cpp; tools/ui_recipes.py writes them).
ui_mods = ["Widescreen", "PhoneUI", "TouchUI", "MobileOptions"]
cfg_defaults = { "profiles/default_profile/user_a2.cfg" = { gfx_resolution = "screen", ui_use_hwcursor = "1" } }

# The dialogue scenes across the whole screen on a Mac too.
[macos]
ui_mods = ["Widescreen"]

# The same on a Linux desktop.
[linux]
ui_mods = ["Widescreen"]

[launcher]
title = "Heroes of Might and Magic V: Tribes of the East"
# The base game's launcher config: a standalone build shows the same launcher.
config_dir = "../.."
install_names = ["Heroes of Might and Magic V", "Heroes V", "HoMM5"]
min_free_mb = 300

[setup]
required_dirs = ["bin", "data", "profiles"]

[bundle]
exclude = ["__redist", "commonappdata", "tmp", "Editor", "Editor Documentation", "*.pdf"]

[settings]
rows = ["window", "frame_limit", "performance_overlay", "filtering"]
page = "tabs"
scaling = "smooth"

# A second copy on the same machine (two players trying LAN play on one
# computer): the game binds net_game_port (8888) and net_lan_match_maker_port
# (8889) without SO_REUSEADDR, so on Windows the second copy cannot bind them.
# The kit moves its binds to 8988/8989 (+100 per further copy) instead
# (kit/runtime/winsock.cpp); a port changed in user.cfg is not covered.
[net]
movable_udp_ports = [8888, 8889]
